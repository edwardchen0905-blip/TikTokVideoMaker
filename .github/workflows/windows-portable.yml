name: Validate and build Windows portable
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Reuse an existing Windows-candidate artifact without rebuilding
        required: false
        type: string
  push:
    branches: [main, 'upgrade/**']
permissions:
  contents: read
  actions: read
jobs:
  business:
    # A changed application must pass its real UI flow before any Windows build.
    # Script-only acceptance reruns reuse their preserved candidate without rebuilding.
    if: ${{ (inputs.candidate_run_id || '') == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare test-only tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install Pillow
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Main branch backend gates
        if: github.ref == 'refs/heads/main'
        run: |
          python -m unittest discover -s tests -v
          node tests/check_ui.cjs
      - name: Real UI and actual production before building
        run: |
          set -o pipefail
          mkdir -p build/evidence
          node tests/ui_business.cjs 2>&1 | tee build/evidence/ui-business.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Linux-business-evidence
          path: build/evidence
          if-no-files-found: ignore
  windows:
    needs: business
    if: always() && !cancelled() && (needs.business.result == 'success' || ((inputs.candidate_run_id || '') != '' && needs.business.result == 'skipped'))
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id || '' }}
      TVM_CAPTURE_ONLY: '0'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare build and test tools
        run: |
          python -m pip install -r requirements.txt pyinstaller==6.22.2 pythonnet==3.1.0 pywinauto Pillow
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          npm install --no-save playwright@1.58.2
          if ($LASTEXITCODE -ne 0) { throw 'UI test dependency installation failed' }
      - name: Download the previously verified runtime source
        if: env.CANDIDATE_RUN_ID == ''
        uses: actions/download-artifact@v4
        with:
          name: Windows-candidate
          path: build/runtime-source
          run-id: 34349459415
          github-token: ${{ github.token }}
      - name: Verify the original archive and reuse its exact runtimes
        if: env.CANDIDATE_RUN_ID == ''
        run: |
          @'
          from pathlib import Path, PurePosixPath
          import hashlib, shutil, zipfile
          archive = Path('build/runtime-source/TikTokVideoMaker_Portable.zip')
          expected = 'a40fdd5cd6b8239ea0a472b6728a43daeed58183f55e7d9b251682c106aa44a0'
          with archive.open('rb') as stream:
              if hashlib.file_digest(stream, 'sha256').hexdigest() != expected:
                  raise SystemExit('Original runtime source SHA-256 mismatch')
          prefix = 'TikTokVideoMaker/runtime/'
          with zipfile.ZipFile(archive) as bundle:
              for item in bundle.infolist():
                  if not item.filename.startswith(prefix) or item.is_dir():
                      continue
                  relative = PurePosixPath(item.filename[len(prefix):])
                  if relative.is_absolute() or '..' in relative.parts:
                      raise SystemExit('Invalid runtime archive path')
                  target = Path('runtime').joinpath(*relative.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with bundle.open(item) as source, target.open('wb') as destination:
                      shutil.copyfileobj(source, destination)
          for name in ('ffmpeg.exe', 'ffprobe.exe', 'webview2/msedgewebview2.exe', 'build-inputs.json'):
              if not (Path('runtime') / name).is_file():
                  raise SystemExit('Missing preserved runtime: ' + name)
          print('Verified runtimes restored from original candidate:', expected)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Preserved runtime verification failed' }
      - name: Build complete portable archive
        if: env.CANDIDATE_RUN_ID == ''
        run: python build_windows.py
      - name: Save candidate and SHA-256 before opening the EXE
        if: env.CANDIDATE_RUN_ID == ''
        uses: actions/upload-artifact@v4
        with:
          name: Windows-candidate
          path: |
            dist/TikTokVideoMaker_Portable.zip
            dist/TikTokVideoMaker_Portable.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Download the unchanged candidate
        if: env.CANDIDATE_RUN_ID != ''
        uses: actions/download-artifact@v4
        with:
          name: Windows-candidate
          path: dist
          run-id: ${{ env.CANDIDATE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Verify the preserved EXE, native dialogs, production, exit and recovery
        run: python tests/windows_acceptance.py
      - name: Upload portable archive after acceptance
        if: success() && env.TVM_CAPTURE_ONLY != '1'
        uses: actions/upload-artifact@v4
        with:
          name: TikTokVideoMaker_Portable
          path: dist/TikTokVideoMaker_Portable.zip
          if-no-files-found: error
          compression-level: 0
      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-build-evidence
          path: |
            runtime/build-inputs.json
            build/evidence
            build/TikTokVideoMaker/warn-TikTokVideoMaker.txt
          if-no-files-found: ignore
